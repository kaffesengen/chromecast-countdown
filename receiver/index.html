<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Countdown Receiver</title>
    <style>
        html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
        .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .title { font-size: 3.5vw; opacity: 0.85; margin-bottom: 1.5vh; text-align: center; }
        .time { font-size: 12vw; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
        .sub { margin-top: 2vh; font-size: 2.5vw; opacity: 0.7; text-align: center; }
    </style>

    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <div class="wrap">
        <div class="title" id="title">Nedtelling</div>
        <div class="time" id="time">--:--:--</div>
        <div class="sub" id="sub">Venter på data...</div>
    </div>

    <script>
        const ctx = cast.framework.CastReceiverContext.getInstance();
        const playerManager = ctx.getPlayerManager();

        const state = {
            targetEpochMs: null,
            label: "Nedtelling",
        };

        function pad(n) { return String(n).padStart(2, "0"); }

        function formatHMS(ms) {
            const totalSec = Math.max(0, Math.floor(ms / 1000));
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            return `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        function render() {
            document.getElementById("title").textContent = state.label || "Nedtelling";
            if (!state.targetEpochMs) {
                document.getElementById("time").textContent = "--:--:--";
                return;
            }
            const now = Date.now();
            const left = state.targetEpochMs - now;
            document.getElementById("time").textContent = formatHMS(left);
            document.getElementById("sub").textContent =
                left <= 0 ? "Tiden er ute!" : `Mål: ${new Date(state.targetEpochMs).toLocaleTimeString()}`;
        }

        // VIKTIG: Her fikser vi navnet på variablene så de matcher Sender-koden
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            (loadRequestData) => {
                const cd = (loadRequestData && loadRequestData.customData) || {};
                
                // Vi sjekker begge varianter for sikkerhets skyld
                state.targetEpochMs = cd.targetEpoch || cd.targetEpochMs || null;
                state.label = cd.label || "Nedtelling";

                console.log("Mottok data:", state);
                render();
                return loadRequestData;
            }
        );

        // Hindrer at Chromecasten skrur av appen fordi den tror den er inaktiv
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true; 

        ctx.start(options);

        setInterval(render, 250);
    </script>
</body>
</html>
