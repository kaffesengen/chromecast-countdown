<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Giraffe Dash Receiver</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        #ui { position: absolute; top: 30px; left: 40px; color: white; font-size: 4vw; z-index: 10; font-style: italic; }
        #lives { position: absolute; top: 30px; right: 40px; font-size: 3vw; z-index: 10; letter-spacing: 5px; }
        
        canvas { 
            width: 100vw; height: 100vh; 
            animation: colorShift 10s infinite alternate;
        }
        
        @keyframes colorShift {
            0% { background: #1a2a6c; }
            33% { background: #b21f1f; }
            66% { background: #4a148c; }
            100% { background: #004d40; }
        }
    </style>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="lives">❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const context = cast.framework.CastReceiverContext.getInstance();
        const NAMESPACE = 'urn:x-cast:no.kaffesengen.catdash';

        let score = 0, lives = 9, gameActive = false, speed = 10, frame = 0, obstacles = [], hitEffect = 0;

        const giraffe = {
            x: 100, y: 0, w: 80, h: 160,
            dy: 0, jumpForce: 30, gravity: 1.5, grounded: false, ducking: false
        };

        context.addCustomMessageListener(NAMESPACE, (e) => {
            const cmd = e.data.command;
            if (cmd === 'START') resetGame();
            if (cmd === 'JUMP' && giraffe.grounded) {
                giraffe.dy = -giraffe.jumpForce;
                giraffe.grounded = false;
            }
            if (cmd === 'DUCK') {
                giraffe.ducking = true;
                setTimeout(() => { giraffe.ducking = false; }, 600);
            }
        });

        function resetGame() {
            score = 0; lives = 9; speed = 10; obstacles = []; gameActive = true;
            giraffe.y = canvas.height - 210;
        }

        function update() {
            if (!gameActive) return;
            frame++;
            if (hitEffect > 0) hitEffect--;

            // Physics
            giraffe.y += giraffe.dy;
            if (giraffe.y + (giraffe.ducking ? 80 : 160) < canvas.height - 50) {
                giraffe.dy += giraffe.gravity;
                giraffe.grounded = false;
            } else {
                giraffe.y = canvas.height - 50 - (giraffe.ducking ? 80 : 160);
                giraffe.dy = 0;
                giraffe.grounded = true;
            }

            // Spawn
            if (frame % Math.floor(800/speed) === 0) {
                const isBird = Math.random() > 0.5;
                obstacles.push({
                    x: canvas.width,
                    y: isBird ? canvas.height - 300 : canvas.height - 130,
                    w: 80, h: 80, type: isBird ? '🦅' : '📦', passed: false
                });
            }

            // Move Obstacles
            obstacles.forEach((obs, i) => {
                obs.x -= speed;
                
                // Collision
                const curH = giraffe.ducking ? 80 : 160;
                if (giraffe.x < obs.x + 60 && giraffe.x + giraffe.w > obs.x + 20 &&
                    giraffe.y < obs.y + 60 && giraffe.y + curH > obs.y + 20) {
                    
                    lives--;
                    hitEffect = 20; // Blinker rødt
                    obstacles.splice(i, 1);
                    if (lives <= 0) gameActive = false;
                    document.getElementById('lives').innerText = '❤️'.repeat(lives);
                }

                if (obs.x + obs.w < giraffe.x && !obs.passed) {
                    obs.passed = true;
                    score += 10;
                    speed += 0.1;
                    document.getElementById('score').innerText = score;
                }
                if (obs.x < -100) obstacles.splice(i, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Giraffe
            ctx.save();
            if (hitEffect % 4 > 1) ctx.filter = 'drop-shadow(0px 0px 20px red) brightness(2)';
            ctx.font = giraffe.ducking ? '80px serif' : '150px serif';
            // Giraffen ser nå mot høyre (bruker 🦒 og speiler hvis nødvendig, men emojien ser vanligvis høyre/venstre avhengig av OS)
            ctx.fillText('🦒', giraffe.x, giraffe.y + (giraffe.ducking ? 70 : 130));
            ctx.restore();

            // Obstacles
            ctx.font = '70px serif';
            obstacles.forEach(obs => {
                ctx.fillText(obs.type, obs.x, obs.y + 60);
            });

            if (!gameActive && lives <= 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffcc00';
                ctx.font = '80px sans-serif';
                ctx.fillText('GAME OVER', canvas.width/2 - 250, canvas.height/2);
            }
            requestAnimationFrame(() => { update(); draw(); });
        }

        context.start();
        draw();
    </script>
</body>
</html>
