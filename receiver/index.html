<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Countdown Receiver v7</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --c1: #051937; --c2: #004d7a; --c3: #008793; --c4: #00bf72;
        }
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(-45deg, var(--c1), var(--c2), var(--c3), var(--c4));
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: #fff; transition: all 1.5s ease;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .title { font-size: 7vw; font-weight: 800; text-transform: uppercase; letter-spacing: 10px; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .time { font-size: 20vw; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; margin: 10px 0; }
        .music-tag { font-size: 2vw; background: rgba(255,255,255,0.1); padding: 10px 40px; border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        
        .bombe-ikon { font-size: 20vw; display: none; }
        .explode { background: radial-gradient(circle, #ff0000, #000) !important; animation: shake 0.1s infinite !important; }
        @keyframes shake { 0% { transform: translate(3px,3px); } 50% { transform: translate(-3px,-3px); } 100% { transform: translate(3px,3px); } }
    </style>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <div class="wrap" id="main-wrap">
        <div id="title-display" class="title">KLAR</div>
        <div class="time" id="time">00:00:00</div>
        <div id="music-text" class="music-tag" style="display:none">🎵 Musikk</div>
        <div class="bombe-ikon" id="bombe-ikon">💣</div>
    </div>

    <audio id="bg-music" loop crossorigin="anonymous"></audio>
    <audio id="explosion-sound" crossorigin="anonymous" src="sounds/bomb.m4a"></audio>

    <script>
        const ctx = cast.framework.CastReceiverContext.getInstance();
        const playerManager = ctx.getPlayerManager();
        const state = { target: null, label: "", finished: false };

        function formatHMS(ms) {
            const s = Math.max(0, Math.floor(ms / 1000));
            return new Date(s * 1000).toISOString().substr(11, 8);
        }

        function render() {
            if (!state.target || state.finished) return;
            const left = state.target - Date.now();
            document.getElementById("title-display").textContent = state.label || "NEDTELLING";
            document.getElementById("time").textContent = formatHMS(left);
            
            if (left <= 0) {
                state.finished = true;
                triggerExplosion();
            }
        }

        function triggerExplosion() {
            document.getElementById("bg-music").pause();
            document.getElementById("main-wrap").classList.add("explode");
            document.getElementById("bombe-ikon").style.display = "block";
            document.getElementById("title-display").textContent = "BOOOOM!";
            document.getElementById("music-text").style.display = "none";
            document.getElementById("explosion-sound").play().catch(e => console.error(e));
        }

        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (data) => {
            const cd = data.customData || {};
            state.target = cd.targetEpoch;
            state.label = cd.label;
            state.finished = false;

            // Oppdater farger
            if (cd.backgroundColors) {
                const r = document.documentElement;
                cd.backgroundColors.forEach((c, i) => r.style.setProperty(`--c${i+1}`, c));
            }

            // Musikk-logikk
            const music = document.getElementById("bg-music");
            if (cd.musicUrl) {
                music.src = cd.musicUrl;
                music.load();
                const p = () => music.play().catch(() => setTimeout(p, 1000));
                music.oncanplay = p;
                document.getElementById("music-text").style.display = "inline-block";
                document.getElementById("music-text").textContent = "🎵 " + cd.musicUrl.split('/').pop().replace('.mp3', '').replace('_', ' ');
            } else {
                music.pause();
                document.getElementById("music-text").style.display = "none";
            }

            document.getElementById("main-wrap").classList.remove("explode");
            document.getElementById("bombe-ikon").style.display = "none";
            return data;
        });

        ctx.start({ disableIdleTimeout: true });
        setInterval(render, 500);
    </script>
</body>
</html>
