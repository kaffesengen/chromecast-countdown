<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bombe Kontroll</title>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #070A12; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: rgba(255,255,255,.05); padding: 30px; border-radius: 25px; width: min(400px, 95%); border: 1px solid rgba(255,255,255,.1); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    label { display: block; font-size: 11px; opacity: 0.6; margin-top: 15px; text-transform: uppercase; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,0.3); color: white; font-size: 16px; }
    .btn-start { background: #2b5797; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
    .btn-stop { background: none; border: 1px solid #ff4444; color: #ff4444; margin-top: 10px; cursor: pointer; }
    #clock { font-family: monospace; font-size: 20px; text-align: center; margin-bottom: 10px; color: #2EE59D; }
    .theme-grid { display: flex; gap: 10px; margin-top: 5px; }
    .theme-btn { flex: 1; height: 30px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <div id="clock">00:00:00</div>
  <div class="header">
    <h2 style="margin:0">Bombe-Timer</h2>
    <google-cast-launcher style="width:35px;height:35px"></google-cast-launcher>
  </div>

  <label>Tittel</label>
  <input type="text" id="label" value="BOMBEN GÅR AV!">

  <label>Tidspunkt (Norsk tid)</label>
  <input type="time" id="time" value="18:00">

  <label>Musikk (.m4a format)</label>
  <select id="music">
    <option value="">Ingen musikk</option>
    <option value="https://kaffesengen.github.io/chromecast-countdown/sounds/chill_morning.m4a">Chill Morning</option>
    <option value="https://kaffesengen.github.io/chromecast-countdown/sounds/morning_vibe.m4a">Morning Vibe</option>
  </select>

  <label>Fargetema</label>
  <div class="theme-grid">
    <button class="theme-btn" onclick="setTheme(['#051937','#00bf72'])" style="background:linear-gradient(to right, #051937, #00bf72)"></button>
    <button class="theme-btn" onclick="setTheme(['#ee0979','#ff6a00'])" style="background:linear-gradient(to right, #ee0979, #ff6a00)"></button>
    <button class="theme-btn" onclick="setTheme(['#021b79','#0575e6'])" style="background:linear-gradient(to right, #021b79, #0575e6)"></button>
  </div>

  <button class="btn-start" id="send">AKTIVER LUNTE</button>
  <button class="btn-stop" id="stop">DESARMER</button>
</div>

<script>
  let selectedColors = ["#051937", "#004d7a", "#008793", "#00bf72"];
  function setTheme(colors) { selectedColors = [colors[0], colors[0], colors[1], colors[1]]; }

  setInterval(() => {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString('nb-NO');
  }, 1000);

  window.__onGCastApiAvailable = (available) => {
    if (available) {
      cast.framework.CastContext.getInstance().setOptions({
        receiverApplicationId: '088AB566',
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
    }
  };

  document.getElementById("send").onclick = async () => {
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    if (!session) return alert("Koble til TV!");

    const [h, m] = document.getElementById("time").value.split(":").map(Number);
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if (target < new Date()) target.setDate(target.getDate() + 1);

    const loadRequest = new chrome.cast.media.LoadRequest(new chrome.cast.media.MediaInfo("count", "application/x-cast"));
    loadRequest.customData = {
      targetEpoch: target.getTime(),
      startEpoch: Date.now(),
      label: document.getElementById("label").value,
      musicUrl: document.getElementById("music").value,
      backgroundColors: selectedColors
    };
    session.loadMedia(loadRequest);
  };
  document.getElementById("stop").onclick = () => cast.framework.CastContext.getInstance().getCurrentSession()?.endSession(true);
</script>
</body>
</html>
