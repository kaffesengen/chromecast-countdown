<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Kontroll</title>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #070A12; color: white; font-family: sans-serif;
      height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px;
    }
    .card {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      padding: 25px; border-radius: 20px; width: min(450px, 100%); backdrop-filter: blur(10px);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cast-btn { width: 35px; height: 35px; cursor: pointer; --disconnected-color: white; --connected-color: #2EE59D; }
    
    label { display: block; font-size: 12px; opacity: 0.7; margin-top: 15px; }
    input, select, button { 
      width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; 
      border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.3); color: white; font-size: 16px;
    }
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    
    button { background: #2b5797; border: none; font-weight: bold; margin-top: 25px; cursor: pointer; }
    button:hover { background: #3572b0; }
    
    .row { display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer; }
    .row input { width: auto; margin: 0; }
    .status { font-size: 12px; margin-top: 20px; color: #2EE59D; font-family: monospace; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2 style="margin:0">TV-Nedtelling</h2>
    <google-cast-launcher class="cast-btn"></google-cast-launcher>
  </div>

  <label>Hva skjer?</label>
  <input type="text" id="label" value="Middag">

  <label>Når? (24-timers klokke)</label>
  <input type="time" id="time" value="18:00">

  <label>Spenningsmusikk</label>
  <select id="music">
    <option value="">Ingen musikk</option>
    <option value="https://cdn.pixabay.com/audio/2022/03/10/audio_afbd95499a.mp3">Cinematic Pulse</option>
    <option value="https://cdn.pixabay.com/audio/2024/02/09/audio_4e7f6e6a12.mp3">Tense Background</option>
    <option value="https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3">Suspenseful Action</option>
  </select>

  <label class="row">
    <input type="checkbox" id="explosion" checked>
    Bruk bombe og sprengelyd
  </label>

  <button id="send">START PÅ TV</button>
  <div class="status" id="status">Venter på Cast...</div>
</div>

<script>
  const APP_ID = "088AB566";
  
  window.__onGCastApiAvailable = (available) => {
    if (available) {
      const ctx = cast.framework.CastContext.getInstance();
      ctx.setOptions({ receiverApplicationId: APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED });
      ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, () => {
        const s = ctx.getCastState();
        document.getElementById("status").innerText = s === "CONNECTED" ? "Koblet til TV ✅" : "Klar til å koble til";
      });
    }
  };

  document.getElementById("send").onclick = async () => {
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    if (!session) return alert("Koble til TV først!");

    const [h, m] = document.getElementById("time").value.split(":").map(Number);
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if (target < new Date()) target.setDate(target.getDate() + 1);

    const loadRequest = new chrome.cast.media.LoadRequest(new chrome.cast.media.MediaInfo("count", "application/x-cast"));
    loadRequest.customData = {
      targetEpoch: target.getTime(),
      label: document.getElementById("label").value,
      musicUrl: document.getElementById("music").value,
      useExplosion: document.getElementById("explosion").checked
    };

    try {
      await session.loadMedia(loadRequest);
      document.getElementById("status").innerText = "Nedtelling i gang!";
    } catch (e) { document.getElementById("status").innerText = "Feil ved start."; }
  };
</script>

</body>
</html>
