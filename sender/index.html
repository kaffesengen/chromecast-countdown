<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nedtelling til klokkeslett - Cast</title>

  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <script>
    // 1. Konfigurasjon
    // const RECEIVER_APP_ID = "CC1AD845"; // Google Default (Bruk denne for feilsøking)
    const RECEIVER_APP_ID = "088AB566"; // Min egen Countdown App ID
    const NAMESPACE = "urn:x-cast:no.timer.countdown"; // Bruk samme i receiver

    // 2. Initialisering av Cast Framework
    window.__onGCastApiAvailable = function(isAvailable) {
      if (isAvailable) {
        initializeCastApi();
      } else {
        console.error("Cast SDK ikke tilgjengelig. Er du på HTTPS?");
      }
    };

    function initializeCastApi() {
      try {
        const context = cast.framework.CastContext.getInstance();
        context.setOptions({
          receiverApplicationId: RECEIVER_APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
        });
        console.log("Cast Context initialisert med ID:", RECEIVER_APP_ID);
      } catch (e) {
        console.error("Feil under initialisering av Cast:", e);
      }
    }
  </script>

  <style>
    :root {
      --bg0: #070A12; --bg1: #0B1020; --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68); --ok: #2EE59D; --warn: #FFB020;
      --radius: 18px; --stroke: rgba(255,255,255,.16);
    }
    body {
      margin: 0; background: linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text); font-family: sans-serif; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: rgba(255,255,255,.05); border: 1px solid var(--stroke);
      padding: 24px; border-radius: var(--radius); width: min(500px, 90%);
      backdrop-filter: blur(10px);
    }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .cast-btn { --disconnected-color: white; --connected-color: var(--ok); width: 32px; height: 32px; }
    input, button { 
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; 
      border: 1px solid var(--stroke); background: rgba(0,0,0,.3); color: white;
    }
    button { background: #2b5797; cursor: pointer; font-weight: bold; border: none; }
    button:hover { background: #3572b0; }
    .status-area { font-size: 12px; margin-top: 15px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,.05); }
    .mono { font-family: monospace; }
  </style>
</head>

<body>

<div class="card">
  <div class="header">
    <div>
      <h2 style="margin:0">Nedtelling</h2>
      <div style="font-size:12px; color:var(--muted)">Send til TV-en din</div>
    </div>
    <google-cast-launcher class="cast-btn"></google-cast-launcher>
  </div>

  <label style="font-size:12px">Hva skal skje?</label>
  <input type="text" id="input_task_label" value="Skole" placeholder="Eks: Middag">

  <label style="font-size:12px; margin-top:15px; display:block">Når?</label>
  <input type="time" id="input_task_time" value="07:45">

  <button id="btn_send">Start på TV</button>

  <div class="status-area" id="status_box">
    Status: <span id="txt_status" class="mono">Venter på tilkobling...</span>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  
  // Element-referanser med unike navn
  const labelInput = $("input_task_label");
  const timeInput = $("input_task_time");
  const sendBtn = $("btn_send");
  const statusTxt = $("txt_status");

  // Oppdater status-tekst når Cast-tilstand endres
  function updateCastStatus() {
    const context = cast.framework.CastContext.getInstance();
    const state = context.getCastState();
    
    if (state === "NO_DEVICES_AVAILABLE") statusTxt.innerText = "Ingen TV funnet (Sjekk WiFi/Serienummer)";
    else if (state === "NOT_CONNECTED") statusTxt.innerText = "Klar til å koble til";
    else if (state === "CONNECTING") statusTxt.innerText = "Kobler til...";
    else if (state === "CONNECTED") statusTxt.innerText = "Koblet til TV ✅";
  }

  // Lytt etter endringer i Cast-status
  setTimeout(() => {
    const ctx = cast.framework.CastContext.getInstance();
    ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, updateCastStatus);
    updateCastStatus();
  }, 1000);

  // Send data til TV
  sendBtn.onclick = async () => {
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    
    if (!session) {
      alert("Du må koble til TV-en først ved å trykke på Cast-ikonet!");
      return;
    }

    const label = labelInput.value;
    const timeVal = timeInput.value;
    
    // Beregn tid
    const [h, m] = timeVal.split(":").map(Number);
    const targetDate = new Date();
    targetDate.setHours(h, m, 0, 0);
    if (targetDate < new Date()) targetDate.setDate(targetDate.getDate() + 1);

    const payload = {
      type: "START_COUNTDOWN",
      label: label,
      targetEpoch: targetDate.getTime()
    };

    // Vi bruker LoadRequest for å trigge receiveren din
    const mediaInfo = new chrome.cast.media.MediaInfo("countdown_id", "application/x-cast-countdown");
    const request = new chrome.cast.media.LoadRequest(mediaInfo);
    request.customData = payload;

    try {
      await session.loadMedia(request);
      statusTxt.innerText = "Nedtelling startet!";
    } catch (e) {
      console.error("Feil ved sending:", e);
      statusTxt.innerText = "Feil: Kunne ikke starte på TV.";
    }
  };
</script>

</body>
</html>
