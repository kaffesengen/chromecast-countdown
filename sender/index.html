<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Premium Cast Control</title>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    :root {
      --accent: #2EE59D;
      --bg-color: #070A12;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

    body {
      margin: 0; font-family: 'Inter', system-ui, sans-serif;
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background-color: var(--bg-color); color: white; overflow: hidden;
    }

    /* Bakgrunnsglød */
    .glow-bg {
      position: fixed; width: 100vw; height: 100vh; z-index: -1;
      background: radial-gradient(circle at center, rgba(46, 229, 157, 0.05) 0%, transparent 70%);
    }

    .card {
      background: var(--glass); border: 1px solid var(--glass-border);
      padding: 40px; border-radius: 35px; width: min(480px, 95%);
      backdrop-filter: blur(25px); box-shadow: 0 50px 100px rgba(0,0,0,0.5);
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    
    google-cast-launcher { width: 42px; height: 42px; cursor: pointer; }
    google-cast-launcher:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px white); }

    label { display: block; font-size: 11px; opacity: 0.4; margin-top: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }

    input, select {
      width: 100%; padding: 15px; margin-top: 8px; border-radius: 15px;
      border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3);
      color: white; font-size: 16px; outline: none; appearance: none;
    }
    input:focus { border-color: var(--accent); }

    /* FIKS AV DE RUNDE BALLENE */
    .theme-row { 
      display: flex; justify-content: space-between; margin-top: 15px; 
      background: rgba(0,0,0,0.2); padding: 20px; border-radius: 25px;
      border: 1px solid var(--glass-border);
    }
    .theme-dot {
      width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; position: relative;
      overflow: hidden; /* Dette fjerner de firkantede hjørnene inni */
      background-clip: padding-box;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .theme-dot:hover { transform: scale(1.15) translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .theme-dot.active { border-color: white; transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .theme-dot.active::after {
      content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-weight: bold; font-size: 14px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn-start {
      background: var(--accent); color: #000; border: none; font-weight: 900;
      margin-top: 35px; cursor: pointer; font-size: 17px; text-transform: uppercase; letter-spacing: 1px;
      padding: 20px; border-radius: 18px; width: 100%;
      box-shadow: 0 10px 25px rgba(46, 229, 157, 0.2);
    }
    .btn-start:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(46, 229, 157, 0.4); filter: brightness(1.1); }
    .btn-start:active { transform: translateY(0); }

    #status { font-size: 12px; text-align: center; margin-top: 20px; opacity: 0.4; }
  </style>
</head>
<body>

<div class="glow-bg" id="glow"></div>

<div class="card">
  <div class="header">
    <h2 style="margin:0; font-weight: 900;">Cast Control</h2>
    <google-cast-launcher></google-cast-launcher>
  </div>

  <label>Tittel</label>
  <input type="text" id="label" value="Middag">

  <label>Tidspunkt</label>
  <input type="time" id="time" value="18:00">

  <label>Musikk</label>
  <select id="music">
    <option value="">Ingen musikk</option>
    <option value="https://kaffesengen.github.io/chromecast-countdown/sounds/chill_morning.m4a">Chill Morning</option>
    <option value="https://kaffesengen.github.io/chromecast-countdown/sounds/morning_vibe.m4a">Morning Vibe</option>
  </select>

  <label>Velg Atmosfære</label>
  <div class="theme-row">
    <div class="theme-dot active" style="background: linear-gradient(135deg, #051937, #00bf72);" onclick="setTheme('nordlys', this, '#00bf72')"></div>
    <div class="theme-dot" style="background: linear-gradient(135deg, #ee0979, #ff6a00);" onclick="setTheme('sunset', this, '#ff6a00')"></div>
    <div class="theme-dot" style="background: linear-gradient(135deg, #021b79, #0575e6);" onclick="setTheme('ocean', this, '#0575e6')"></div>
    <div class="theme-dot" style="background: linear-gradient(135deg, #232526, #434343);" onclick="setTheme('dark', this, '#ffffff')"></div>
  </div>

  <button class="btn-start" id="send">Start på TV</button>
  <div id="status">Klar for casting</div>
</div>

<script>
  const APP_ID = "088AB566";
  let selectedColors = ["#051937", "#004d7a", "#008793", "#00bf72"];
  const themes = {
    nordlys: ["#051937", "#004d7a", "#008793", "#00bf72"],
    sunset: ["#ee0979", "#ff6a00", "#f42f4b", "#ff9068"],
    ocean: ["#021b79", "#0575e6", "#203a43", "#2c5364"],
    dark: ["#232526", "#414345", "#000000", "#434343"]
  };

  function setTheme(t, el, accent) {
    selectedColors = themes[t];
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('glow').style.background = `radial-gradient(circle at center, ${accent}15 0%, transparent 70%)`;
  }

  window.__onGCastApiAvailable = (available) => {
    if (available) {
      cast.framework.CastContext.getInstance().setOptions({
        receiverApplicationId: APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
    }
  };

  document.getElementById("send").onclick = async () => {
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    if (!session) return alert("Koble til TV først!");

    const [h, m] = document.getElementById("time").value.split(":").map(Number);
    const target = new Date(); target.setHours(h, m, 0, 0);
    if (target < new Date()) target.setDate(target.getDate() + 1);

    const loadRequest = new chrome.cast.media.LoadRequest(new chrome.cast.media.MediaInfo("count", "application/x-cast"));
    loadRequest.customData = {
      targetEpoch: target.getTime(),
      label: document.getElementById("label").value,
      musicUrl: document.getElementById("music").value,
      backgroundColors: selectedColors
    };
    await session.loadMedia(loadRequest);
    document.getElementById("status").innerText = "Overført til TV ✅";
  };
</script>
</body>
</html>
