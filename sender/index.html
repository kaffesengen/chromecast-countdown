<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Kontroll</title>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, sans-serif; height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 15px;
      background: linear-gradient(270deg, #070A12, #0B1020, #070A12);
      background-size: 400% 400%;
      animation: MovingBg 15s ease infinite;
      color: white;
    }
    @keyframes MovingBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
      padding: 30px; border-radius: 25px; width: min(450px, 100%);
      backdrop-filter: blur(15px); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .cast-btn { width: 38px; height: 38px; cursor: pointer; --disconnected-color: white; --connected-color: #2EE59D; }
    
    label { display: block; font-size: 13px; opacity: 0.8; margin-top: 18px; font-weight: 500; }
    input, select, button { 
      width: 100%; padding: 14px; margin-top: 6px; border-radius: 12px; 
      border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,0.4); color: white; font-size: 16px;
    }
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    
    .info-box { 
      background: rgba(46, 229, 157, 0.1); border-left: 4px solid #2EE59D;
      padding: 12px; margin-top: 20px; font-size: 13px; border-radius: 4px;
    }

    .btn-start { background: #2b5797; border: none; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.2s; }
    .btn-start:hover { background: #3c78c9; transform: translateY(-2px); }
    
    .btn-stop { background: rgba(255, 50, 50, 0.2); border: 1px solid rgba(255, 50, 50, 0.5); font-weight: bold; margin-top: 10px; cursor: pointer; color: #ffbcbc; }
    .btn-stop:hover { background: rgba(255, 50, 50, 0.4); }
    
    .status { font-size: 12px; margin-top: 15px; text-align: center; opacity: 0.7; font-family: monospace; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2 style="margin:0">Kontrollpanel</h2>
    <google-cast-launcher class="cast-btn"></google-cast-launcher>
  </div>

  <label>Hva skjer?</label>
  <input type="text" id="label" value="Middag" maxlength="30">

  <label>Måltid (24t)</label>
  <input type="time" id="time" value="18:00">

  <label>Velg musikk fra mappen din</label>
  <select id="music" onchange="updateMusicInfo()">
    <option value="">Ingen musikk</option>
    <option value="sounds/chill_morning.mp3">Chill Morning</option>
    <option value="sounds/morning_vibe.mp3">Morning Vibe</option>
  </select>

  <div class="info-box" id="music-info">Valgt musikk: Ingen</div>

  <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 20px;">
    <input type="checkbox" id="explosion" checked style="width: auto; margin:0;">
    Aktiver bombe-effekt (bomb.m4a)
  </label>

  <button class="btn-start" id="send">START NEDTELLING</button>
  <button class="btn-stop" id="stop">STOPP ALT</button>
  
  <div class="status" id="status">Koble til en enhet for å begynne</div>
</div>

<script>
  const APP_ID = "088AB566";
  
  function updateMusicInfo() {
    const sel = document.getElementById("music");
    const text = sel.options[sel.selectedIndex].text;
    document.getElementById("music-info").innerText = "Valgt musikk: " + text;
  }

  window.__onGCastApiAvailable = (available) => {
    if (available) {
      const ctx = cast.framework.CastContext.getInstance();
      ctx.setOptions({ 
        receiverApplicationId: APP_ID, 
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED 
      });
      ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, () => {
        const s = ctx.getCastState();
        document.getElementById("status").innerText = s === "CONNECTED" ? "Koblet til TV ✅" : "Søker etter enheter...";
      });
    }
  };

  // STOPP-FUNKSJON
  document.getElementById("stop").onclick = () => {
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    if (session) {
      session.endSession(true);
      document.getElementById("status").innerText = "Nedtelling stoppet.";
    }
  };

  document.getElementById("send").onclick = async () => {
    const session = cast.framework.CastContext.getInstance().getCurrentSession();
    if (!session) return alert("Koble til TV først!");

    const [h, m] = document.getElementById("time").value.split(":").map(Number);
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if (target < new Date()) target.setDate(target.getDate() + 1);

    const loadRequest = new chrome.cast.media.LoadRequest(new chrome.cast.media.MediaInfo("count", "application/x-cast"));
    loadRequest.customData = {
      targetEpoch: target.getTime(),
      label: document.getElementById("label").value,
      musicUrl: document.getElementById("music").value,
      useExplosion: document.getElementById("explosion").checked
    };

    try {
      await session.loadMedia(loadRequest);
      document.getElementById("status").innerText = "Suksess! Nedtelling startet.";
    } catch (e) { 
      document.getElementById("status").innerText = "Kunne ikke starte."; 
    }
  };
</script>

</body>
</html>
