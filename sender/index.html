<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Katte-Kontroller</title>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <style>
    body { margin: 0; background: #111; font-family: 'Arial Black', sans-serif; overflow: hidden; color: white; text-align: center; }
    .btn-container { display: grid; grid-template-columns: 1fr 1fr; height: 70vh; gap: 10px; padding: 10px; }
    .control-btn { border: none; border-radius: 20px; font-size: 30px; font-weight: bold; color: white; text-transform: uppercase; box-shadow: 0 10px #000; }
    .control-btn:active { transform: translateY(5px); box-shadow: 0 5px #000; }
    .jump { background: #ffcc00; color: #000; }
    .duck { background: #008793; }
    .start-btn { width: 95%; padding: 20px; margin-top: 10px; background: #2EE59D; border-radius: 15px; border: none; font-size: 20px; font-weight: bold; }
    .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 24px;">🐱 CAT DASH</div>
    <google-cast-launcher style="width:40px;height:40px"></google-cast-launcher>
  </div>

  <button class="start-btn" onclick="sendCommand('START')">START SPILL</button>

  <div class="btn-container">
    <button class="control-btn jump" onmousedown="sendCommand('JUMP')" ontouchstart="sendCommand('JUMP')">HOPP</button>
    <button class="control-btn duck" onmousedown="sendCommand('DUCK')" ontouchstart="sendCommand('DUCK')">DUKK</button>
  </div>

  <script>
    const APP_ID = '088AB566';
    window.__onGCastApiAvailable = (isAvailable) => {
      if (isAvailable) {
        cast.framework.CastContext.getInstance().setOptions({
          receiverApplicationId: APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
        });
      }
    };

    function sendCommand(cmd) {
      const session = cast.framework.CastContext.getInstance().getCurrentSession();
      if (session) {
        // Vi bruker custom messages for lynrask respons i spillet
        session.sendMessage('urn:x-cast:no.kaffesengen.catdash', { command: cmd });
      }
    }
  </script>
</body>
</html>
