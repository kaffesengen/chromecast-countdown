<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown Kontrollpanel</title>

  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg0: #070A12; --bg1: #0B1020; --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68); --ok: #2EE59D; --accent: #2b5797;
      --radius: 18px; --stroke: rgba(255,255,255,.16);
    }

    body {
      margin: 0; background: linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text); font-family: -apple-system, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,.05); border: 1px solid var(--stroke);
      padding: 24px; border-radius: var(--radius); width: min(450px, 100%);
      backdrop-filter: blur(15px); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    
    .cast-btn { 
      --disconnected-color: white; --connected-color: var(--ok); 
      width: 32px; height: 32px; cursor: pointer;
    }

    label { display: block; font-size: 13px; color: var(--muted); margin-top: 16px; margin-bottom: 4px; }

    input, select, button { 
      width: 100%; padding: 14px; border-radius: 12px; 
      border: 1px solid var(--stroke); background: rgba(0,0,0,0.3); 
      color: white; font-size: 16px; outline: none;
    }

    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .checkbox-row {
      display: flex; align-items: center; gap: 10px; margin-top: 20px; cursor: pointer;
    }
    .checkbox-row input { width: auto; margin: 0; cursor: pointer; }

    button { 
      background: var(--accent); border: none; font-weight: bold; 
      margin-top: 25px; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:hover { background: #3572b0; }

    .status-area { 
      font-size: 12px; margin-top: 20px; padding: 12px; 
      border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--stroke);
    }
    .mono { font-family: monospace; color: var(--ok); }
  </style>
</head>

<body>

<div class="card">
  <div class="header">
    <h2 style="margin:0; font-size: 22px;">Nedtelling</h2>
    <google-cast-launcher class="cast-btn"></google-cast-launcher>
  </div>

  <label>Hva skal skje?</label>
  <input type="text" id="input_label" value="Skole" placeholder="Eks: Middag">

  <label>Når skal det skje? (24t)</label>
  <input type="time" id="input_time" value="07:45">

  <label>Velg spenningsmusikk</label>
  <select id="select_music">
    <option value="">Ingen musikk</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Spenningsmusikk 1 (Test)</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Spenningsmusikk 2 (Test)</option>
  </select>

  <label class="checkbox-row">
    <input type="checkbox" id="check_explosion" checked>
    <span>Aktiver bombe-eksplosjon når ferdig</span>
  </label>

  <button id="btn_send">Start på TV</button>

  <div class="status-area">
    Status: <span id="txt_status" class="mono">Venter på tilkobling...</span>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const APP_ID = "088AB566";

  // Initialisering
  window.__onGCastApiAvailable = (isAvailable) => {
    if (isAvailable) {
      const context = cast.framework.CastContext.getInstance();
      context.setOptions({
        receiverApplicationId: APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
      
      context.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, () => {
        const state = context.getCastState();
        const statusMap = {
          "NO_DEVICES_AVAILABLE": "Ingen TV funnet",
          "NOT_CONNECTED": "Klar til å koble til",
          "CONNECTING": "Kobler til...",
          "CONNECTED": "Koblet til TV ✅"
        };
        $("txt_status").innerText = statusMap[state] || state;
      });
    }
  };

  $("btn_send").onclick = async () => {
    const context = cast.framework.CastContext.getInstance();
    const session = context.getCurrentSession();
    
    if (!session) {
      alert("Trykk på Cast-ikonet først!");
      return;
    }

    // Beregn måltid
    const [h, m] = $("input_time").value.split(":").map(Number);
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if (target < new Date()) target.setDate(target.getDate() + 1);

    const payload = {
      type: "START_COUNTDOWN",
      label: $("input_label").value,
      targetEpoch: target.getTime(),
      musicUrl: $("select_music").value,
      useExplosion: $("check_explosion").checked
    };

    const mediaInfo = new chrome.cast.media.MediaInfo("countdown", "application/x-cast-countdown");
    const request = new chrome.cast.media.LoadRequest(mediaInfo);
    request.customData = payload;

    try {
      await session.loadMedia(request);
      $("txt_status").innerText = "Sendt til TV!";
    } catch (e) {
      console.error(e);
      $("txt_status").innerText = "Feil ved sending.";
    }
  };
</script>

</body>
</html>
